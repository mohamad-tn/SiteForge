services:
  postgres:
    image: postgres:16
    container_name: siteforge-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: siteforge
      POSTGRES_PASSWORD: siteforge
      POSTGRES_DB: siteforge
    volumes:
      - siteforge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siteforge -d siteforge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  siteforge_pgdata:
